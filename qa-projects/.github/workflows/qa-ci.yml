name: QA Projects CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r python-projects/requirements.txt
      - run: python -m pytest python-projects/tests -q
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix javascript-fundamentals test
      - run: npm --prefix postman-api-testing test
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sql-portfolio/scripts/run_all.py
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
        working-directory: playwright-testing
      - run: npx playwright install --with-deps chromium
        working-directory: playwright-testing
      - run: npm test
        working-directory: playwright-testing
